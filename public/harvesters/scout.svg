<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-16 -14 44 28" width="220" height="140"
     role="img" aria-label="Small east-facing spice harvester">
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- Ground shadow -->
    <ellipse cx="3" cy="2" rx="17" ry="9.5"
             fill="#000" opacity=".22"/>

    <!-- Suspension -->
    <g fill="#475569" stroke="#111827" stroke-width=".7">
      <rect x="-8" y="-9" width="4" height="18"/>
      <rect x="4" y="-9" width="4" height="18"/>
    </g>

    <!-- Four armored tread pods -->
    <g fill="#1c1917" stroke="#111827" stroke-width=".8">
      <rect x="-10" y="-11" width="9" height="5" rx="1"/>
      <rect x="1" y="-11" width="9" height="5" rx="1"/>
      <rect x="-10" y="6" width="9" height="5" rx="1"/>
      <rect x="1" y="6" width="9" height="5" rx="1"/>
    </g>

    <!-- Tread ribs -->
    <g fill="none" stroke="#57534e" stroke-width=".65">
      <path d="M-8.5-10.5v4 M-6.5-10.5v4 M-4.5-10.5v4 M-2.5-10.5v4
               M2.5-10.5v4 M4.5-10.5v4 M6.5-10.5v4 M8.5-10.5v4
               M-8.5 6.5v4 M-6.5 6.5v4 M-4.5 6.5v4 M-2.5 6.5v4
               M2.5 6.5v4 M4.5 6.5v4 M6.5 6.5v4 M8.5 6.5v4"/>
    </g>

    <!-- Lower hull: visible south-facing thickness -->
    <path d="M-11-5H7L11-2V6L7 9H-9L-11 7Z"
          fill="#075985" stroke="#111827" stroke-width=".8"/>

    <!-- Main armored hull -->
    <path d="M-11-6L-9-8H6L11-5V5L7 7H-9L-11 5Z"
          fill="#0369a1" stroke="#111827" stroke-width=".9"/>

    <!-- Roof bevels -->
    <path d="M-9-7H6L9-5H-8Z" fill="#38bdf8"/>
    <path d="M-10-5H-8V4L-10 5Z" fill="#0ea5e9"/>
    <path d="M6-7L10-4.5V4.5L7 6H5Z" fill="#075985"/>
    <path d="M-9 5H7L5 7H-9Z" fill="#0284c7"/>

    <!-- Rear engine compartment -->
    <rect x="-10" y="-4.8" width="3.5" height="9.6"
          rx=".4" fill="#334155" stroke="#111827" stroke-width=".6"/>
    <g stroke="#94a3b8" stroke-width=".5">
      <path d="M-9.3-3.5h2 M-9.3-2h2 M-9.3-.5h2
               M-9.3 1h2 M-9.3 2.5h2 M-9.3 4h2"/>
    </g>

    <!-- Open cargo hopper -->
    <rect x="-6.3" y="-5.5" width="9.5" height="11"
          rx=".5" fill="#94a3b8" stroke="#111827" stroke-width=".7"/>
    <rect x="-5.4" y="-4.6" width="7.7" height="9.2"
          fill="#0f172a"/>

    <!-- Spice cargo -->
    <path d="M-5.2 4.3V-1.8L-3.8-3L-2.3-2.2L-.8-3.5
             L1-2.7L2.1-1.2V4.3Z" fill="#9333ea"/>
    <path d="M-5.2-1.8L-3.8-3L-2.3-2.2L-.8-3.5
             L1-2.7L2.1-1.2L.3-.3L-1.8-1.3L-3 .2Z"
          fill="#c084fc"/>
    <g fill="#e9d5ff" opacity=".7">
      <rect x="-3.8" y="1" width=".7" height=".7"/>
      <rect x="-.7" y="2.5" width=".8" height=".6"/>
      <rect x=".5" y="-.8" width=".6" height=".6"/>
    </g>

    <!-- Hopper retaining ribs -->
    <g stroke="#64748b" stroke-width=".55">
      <path d="M-3.5-4.6v9.2 M-.6-4.6v9.2"/>
    </g>

    <!-- Raised forward cab -->
    <path d="M4-4.8H7.5L9-3V3L7.5 4.8H4Z"
          fill="#94a3b8" stroke="#111827" stroke-width=".7"/>
    <path d="M5-3.7H7L8-2.4V2.4L7 3.7H5Z"
          fill="#082f49" stroke="#111827" stroke-width=".5"/>
    <path d="M5.5-3.1H6.7L7.4-2.2V-.6H5.5Z" fill="#38bdf8"/>
    <path d="M5.7-2.7H6.6" stroke="#bae6fd" stroke-width=".5"/>

    <!-- Orange corner guards -->
    <g fill="#f97316" stroke="#111827" stroke-width=".4">
      <rect x="-9" y="-7.8" width="2.5" height="1.5"/>
      <rect x="-9" y="6" width="2.5" height="1.5"/>
      <rect x="7.3" y="-6.2" width="2" height="1.4"/>
      <rect x="7.3" y="5" width="2" height="1.4"/>
    </g>

    <!-- Status indicator and headlights -->
    <circle cx="3.8" cy="-5.5" r="1" fill="#111827"/>
    <circle cx="3.8" cy="-5.5" r=".55" fill="#22c55e"/>
    <g fill="#a5f3fc" stroke="#111827" stroke-width=".4">
      <rect x="9" y="-4" width="1.2" height="1.8"/>
      <rect x="9" y="2.2" width="1.2" height="1.8"/>
    </g>

    <!-- Hydraulic scoop arms -->
    <g fill="none">
      <path d="M9-2.5H13 M9 2.5H13"
            stroke="#111827" stroke-width="2.5"/>
      <path d="M9-2.5H13 M9 2.5H13"
            stroke="#94a3b8" stroke-width="1.3"/>
    </g>

    <!-- Scoop underside and main plate -->
    <path d="M13-4.4L17-2.8L19 1L17 4.8L13 6.4Z"
          fill="#475569" stroke="#111827" stroke-width=".7"/>
    <path d="M13-5.4L17-3.8L19 0L17 3.8L13 5.4Z"
          fill="#94a3b8" stroke="#111827" stroke-width=".7"/>
    <path d="M13.7-4.2L16.3-3.1L17.8 0L16.3 3.1L13.7 4.2Z"
          fill="#cbd5e1"/>

    <!-- Cutting teeth -->
    <g fill="#94a3b8" stroke="#111827" stroke-width=".5">
      <path d="M17-4.8L21-3.8L17-2.8Z"/>
      <path d="M18-2.3L22-1.3L18-.3Z"/>
      <path d="M18 .3L22 1.3L18 2.3Z"/>
      <path d="M17 2.8L21 3.8L17 4.8Z"/>
    </g>

    <!-- Scoop drive motor -->
    <circle cx="14.5" cy="0" r="2.1"
            fill="#334155" stroke="#111827" stroke-width=".6"/>
    <circle cx="14.5" cy="0" r="1.2" fill="#f97316"/>
    <circle cx="14.5" cy="0" r=".45" fill="#fbbf24"/>

    <!-- Small hull fasteners -->
    <g fill="#cbd5e1">
      <circle cx="-9.5" cy="-5.5" r=".3"/>
      <circle cx="-9.5" cy="5.5" r=".3"/>
      <circle cx="6.5" cy="-6" r=".3"/>
      <circle cx="6.5" cy="6" r=".3"/>
    </g>
  </g>
</svg>
